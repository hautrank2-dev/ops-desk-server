<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsDesk AI Architecture</title>
<style>
  :root{--bg:#fff;--text:#2c2c2a;--muted:#5f5e5a;--line:#888780;--box-f:#f1efe8;--box-s:#b4b2a9}
  @media (prefers-color-scheme:dark){:root{--bg:#1f1f1d;--text:#f1efe8;--muted:#b4b2a9;--line:#b4b2a9;--box-f:#2c2c2a;--box-s:#5f5e5a}}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:720px;margin:0 auto}
  h1{font-size:22px;font-weight:500;margin:0 0 4px}
  p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
  svg{width:100%;height:auto;display:block}
  .t,.ts,.th{fill:var(--text);font-family:inherit}
  .t{font-size:14px}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:var(--muted)}
  .arr{stroke:var(--line);stroke-width:1.5;fill:none}
  .box rect{fill:var(--box-f);stroke:var(--box-s)}
  g[class^="c-"] rect{fill:var(--f);stroke:var(--s)}
  g[class^="c-"] .th{fill:var(--tt)}
  g[class^="c-"] .ts{fill:var(--ts)}
  .c-gray{--f:#f1efe8;--s:#5f5e5a;--tt:#444441;--ts:#5f5e5a}
  .c-teal{--f:#e1f5ee;--s:#0f6e56;--tt:#085041;--ts:#0f6e56}
  .c-purple{--f:#eeedfe;--s:#534ab7;--tt:#3c3489;--ts:#534ab7}
  .c-coral{--f:#faece7;--s:#993c1d;--tt:#712b13;--ts:#993c1d}
  @media (prefers-color-scheme:dark){
    .c-gray{--f:#444441;--s:#d3d1c7;--tt:#f1efe8;--ts:#d3d1c7}
    .c-teal{--f:#085041;--s:#9fe1cb;--tt:#e1f5ee;--ts:#9fe1cb}
    .c-purple{--f:#3c3489;--s:#cecbf6;--tt:#eeedfe;--ts:#cecbf6}
    .c-coral{--f:#712b13;--s:#f5c4b3;--tt:#faece7;--ts:#f5c4b3}
  }
  ul.legend{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted)}
  ul.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid}
</style>
</head>
<body>
<main>
<h1>OpsDesk AI assistant architecture</h1>
<p class="sub">Next.js client, NestJS AI module, Claude tool use, SSE streaming.</p>

<svg viewBox="0 0 680 770" role="img" aria-labelledby="ttl desc">
<title id="ttl">OpsDesk AI module architecture</title>
<desc id="desc">Client sends POST /api/ai/chat to the NestJS AI module. Inside it, AiService builds a Claude request with model, system, messages, tools, max_tokens and thinking, runs a tool-use loop over retrieval and write tools, and streams SSE events back. Claude API and MongoDB sit below the server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray">
<rect x="40" y="20" width="600" height="96" rx="16" stroke-width="0.5"/>
<text class="th" x="60" y="42">Client · Next.js</text>
</g>
<g class="c-teal">
<rect x="60" y="56" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="195" y="72" text-anchor="middle" dominant-baseline="central">Chat widget</text>
<text class="ts" x="195" y="89" text-anchor="middle" dominant-baseline="central">aiApi.chat → httpClient (fetch adapter)</text>
</g>
<g class="c-teal">
<rect x="350" y="56" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="485" y="72" text-anchor="middle" dominant-baseline="central">UI cards</text>
<text class="ts" x="485" y="89" text-anchor="middle" dominant-baseline="central">Ranking · user picker</text>
</g>

<line x1="195" y1="116" x2="195" y2="168" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="207" y="144">POST /api/ai/chat</text>
<line x1="485" y1="168" x2="485" y2="118" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="497" y="144">SSE: text, tool, card</text>

<g class="c-gray">
<rect x="40" y="170" width="600" height="480" rx="16" stroke-width="0.5"/>
<text class="th" x="60" y="192">Server · NestJS</text>
</g>
<g class="c-purple">
<rect x="60" y="206" width="560" height="428" rx="14" stroke-width="0.5"/>
<text class="th" x="80" y="228">AI module · src/modules/ai</text>
</g>

<g class="box">
<rect x="80" y="244" width="230" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="195" y="260" text-anchor="middle" dominant-baseline="central">AiController</text>
<text class="ts" x="195" y="277" text-anchor="middle" dominant-baseline="central">POST /api/ai/chat (SSE)</text>
</g>
<g class="box">
<rect x="330" y="244" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="465" y="260" text-anchor="middle" dominant-baseline="central">Conversations API</text>
<text class="ts" x="465" y="277" text-anchor="middle" dominant-baseline="central">GET/DELETE /api/ai/conversations</text>
</g>

<g class="c-coral">
<rect x="80" y="308" width="164" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="162" y="324" text-anchor="middle" dominant-baseline="central">model</text>
<text class="ts" x="162" y="341" text-anchor="middle" dominant-baseline="central">claude-sonnet-5-5</text>
</g>
<g class="c-coral">
<rect x="258" y="308" width="164" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="324" text-anchor="middle" dominant-baseline="central">system</text>
<text class="ts" x="340" y="341" text-anchor="middle" dominant-baseline="central">Cached prompt</text>
</g>
<g class="c-coral">
<rect x="436" y="308" width="164" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="518" y="324" text-anchor="middle" dominant-baseline="central">messages</text>
<text class="ts" x="518" y="341" text-anchor="middle" dominant-baseline="central">History + context</text>
</g>
<g class="c-coral">
<rect x="80" y="364" width="164" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="162" y="380" text-anchor="middle" dominant-baseline="central">tools</text>
<text class="ts" x="162" y="397" text-anchor="middle" dominant-baseline="central">6 strict schemas</text>
</g>
<g class="c-coral">
<rect x="258" y="364" width="164" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="380" text-anchor="middle" dominant-baseline="central">max_tokens</text>
<text class="ts" x="340" y="397" text-anchor="middle" dominant-baseline="central">16000</text>
</g>
<g class="c-coral">
<rect x="436" y="364" width="164" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="518" y="380" text-anchor="middle" dominant-baseline="central">thinking</text>
<text class="ts" x="518" y="397" text-anchor="middle" dominant-baseline="central">Adaptive, medium</text>
</g>

<line x1="340" y1="412" x2="340" y2="430" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="80" y="432" width="520" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="448" text-anchor="middle" dominant-baseline="central">AiService · tool-use loop</text>
<text class="ts" x="340" y="465" text-anchor="middle" dominant-baseline="central">stream → tool_use → run → tool_result → repeat (max 8)</text>
</g>

<line x1="185" y1="480" x2="185" y2="498" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="480" x2="380" y2="498" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="480" x2="535" y2="498" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="80" y="500" width="210" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="516" text-anchor="middle" dominant-baseline="central">Retrieval tools (agentic RAG)</text>
<text class="ts" x="185" y="533" text-anchor="middle" dominant-baseline="central">4 live DB lookups</text>
</g>
<g class="c-coral">
<rect x="305" y="500" width="150" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="516" text-anchor="middle" dominant-baseline="central">present_ranking</text>
<text class="ts" x="380" y="533" text-anchor="middle" dominant-baseline="central">UI tool, no DB</text>
</g>
<g class="c-coral">
<rect x="470" y="500" width="130" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="516" text-anchor="middle" dominant-baseline="central">assign_ticket</text>
<text class="ts" x="535" y="533" text-anchor="middle" dominant-baseline="central">Only write tool</text>
</g>

<line x1="340" y1="548" x2="340" y2="566" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="80" y="568" width="520" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="584" text-anchor="middle" dominant-baseline="central">SSE streaming response</text>
<text class="ts" x="340" y="601" text-anchor="middle" dominant-baseline="central">meta · thinking · text · tool · card · done</text>
</g>

<line x1="195" y1="650" x2="195" y2="688" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="485" y1="650" x2="485" y2="688" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="60" y="690" width="270" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="195" y="707" text-anchor="middle" dominant-baseline="central">Claude API</text>
<text class="ts" x="195" y="725" text-anchor="middle" dominant-baseline="central">messages.stream · tool use</text>
</g>
<g class="box">
<rect x="350" y="690" width="270" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="485" y="707" text-anchor="middle" dominant-baseline="central">MongoDB</text>
<text class="ts" x="485" y="725" text-anchor="middle" dominant-baseline="central">tickets · users · conversations</text>
</g>
</svg>

<ul class="legend">
  <li><i style="background:#e1f5ee;border-color:#0f6e56"></i>Client</li>
  <li><i style="background:#eeedfe;border-color:#534ab7"></i>Server / Claude</li>
  <li><i style="background:#faece7;border-color:#993c1d"></i>AI concepts: tool use, system, streaming</li>
</ul>
</main>
</body>
</html>
